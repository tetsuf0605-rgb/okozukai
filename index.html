<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>おこづかい帳</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF8FC;--bg2:#F0ECF8;--bg3:#EDE8F5;--ac:#C9B8E8;--ac-d:#9B7ED4;--ac2:#F5C2D8;--ac2-d:#D45F8C;--mint:#D4EEE7;--mint-d:#3BAB84;--text:#3A2F4E;--text2:#7A6D8E;--text3:#A899BB;--border:#E2D9F0;--white:#FFF;--grad:linear-gradient(135deg,#C9B8E8,#F5C2D8);--grad-btn:linear-gradient(135deg,#B8A0E0,#EDA0C4);--shadow:0 2px 12px rgba(160,120,210,0.12)}
body.theme-pink{--bg:#FFF8FB;--bg2:#FDE8F2;--bg3:#FACDE2;--ac:#F5B8D4;--ac-d:#C8336E;--ac2:#F9D4A8;--ac2-d:#C86020;--text:#4A1F35;--text2:#8E4A68;--text3:#BF88A2;--border:#F0C8DC;--white:#FFF;--grad:linear-gradient(135deg,#F5B8D4,#F9B870);--grad-btn:linear-gradient(135deg,#EF90BB,#F0A850);--shadow:0 2px 12px rgba(210,80,140,0.12)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;transition:background 0.3s}
.app{padding-bottom:68px}
.header{background:var(--white);padding:14px 16px 0;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(180,140,220,0.08)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.app-title{font-size:18px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:8px}
.mode-toggle{display:flex;background:var(--bg2);border-radius:20px;padding:3px;gap:2px}
.mode-btn{padding:5px 11px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--text2);border-radius:16px;font-weight:500}
.mode-btn.active{background:var(--grad-btn);color:white;box-shadow:0 2px 6px rgba(180,130,210,0.35)}
.child-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0}
.child-tab{flex-shrink:0;padding:6px 20px;border-radius:14px 14px 0 0;border:1px solid var(--border);border-bottom:none;font-size:13px;cursor:pointer;background:var(--bg2);color:var(--text2);font-weight:500;transition:all 0.2s}
.child-tab.active{background:var(--white);color:var(--ac-d);font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--ac2-d);color:white;font-size:10px;font-weight:700;padding:0 4px;margin-left:3px}
.section{padding:12px 16px}
.balance-card{background:var(--grad);border-radius:18px;padding:16px 20px;margin-bottom:10px;color:white;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.balance-card::after{content:"";position:absolute;right:-20px;top:-20px;width:100px;height:100px;background:rgba(255,255,255,0.12);border-radius:50%}
.balance-label{font-size:11px;opacity:.85;margin-bottom:3px}
.balance-amount{font-size:30px;font-weight:700;letter-spacing:-.5px}
.balance-amount span{font-size:15px;font-weight:500}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:var(--white);border-radius:14px;padding:10px 13px;border:1px solid var(--border)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:2px}
.stat-value{font-size:17px;font-weight:700}
.stat-value.income{color:var(--mint-d)}
.stat-value.expense{color:var(--ac2-d)}
.section-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.goal-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.goal-bar-wrap{background:var(--bg2);border-radius:8px;height:9px;margin:7px 0 4px;overflow:hidden}
.goal-bar{height:100%;border-radius:8px;background:var(--grad)}
.goal-info{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}
.tx-list{display:flex;flex-direction:column;gap:5px}
.tx-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--white);border:1px solid var(--border);border-radius:13px}
.tx-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-date{font-size:11px;color:var(--text3)}
.tx-amount{font-size:13px;font-weight:700;flex-shrink:0}
.tx-amount.income{color:var(--mint-d)}
.tx-amount.expense{color:var(--ac2-d)}
.tx-del{background:none;border:none;cursor:pointer;color:var(--text3);padding:2px;flex-shrink:0;font-size:14px}
.pending-item{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:11px;margin-bottom:7px}
.pending-header{display:flex;gap:9px;margin-bottom:9px}
.pending-icon{width:34px;height:34px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.pending-name{font-size:13px;font-weight:600;color:var(--text)}
.pending-detail{font-size:11px;color:var(--text2);margin:2px 0}
.pending-amount{font-size:14px;font-weight:700;color:var(--mint-d)}
.action-row{display:flex;gap:7px}
.approve-btn{flex:1;padding:9px;border:none;border-radius:12px;font-size:13px;cursor:pointer;background:linear-gradient(135deg,#B8D9CC,#A0D4C0);color:#1B6E52;font-weight:600}
.reject-btn{flex:1;padding:9px;border:none;border-radius:12px;font-size:13px;cursor:pointer;background:linear-gradient(135deg,#F5D0DE,#F0B8CC);color:#9B3060;font-weight:600}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -3px 12px rgba(160,120,210,0.1);padding:0 0 2px}
.nav-tab{flex:1;padding:7px 4px 5px;font-size:10px;text-align:center;cursor:pointer;color:var(--text3);border:none;background:transparent;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color 0.15s}
.nav-tab.active{color:var(--ac-d);font-weight:700}
.nav-tab .paw-wrap{display:flex;align-items:center;justify-content:center;width:26px;height:26px;position:relative}
.modal-overlay{position:fixed;inset:0;background:rgba(58,47,78,0.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal-box{background:var(--white);border-radius:20px;padding:20px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(140,100,200,0.2);max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.modal-body{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.modal-actions{display:flex;gap:8px}
.modal-cancel{flex:1;padding:10px;border:1px solid var(--border);border-radius:12px;font-size:13px;cursor:pointer;background:transparent;color:var(--text2)}
.modal-ok{flex:1;padding:10px;border:none;border-radius:12px;font-size:13px;cursor:pointer;background:var(--grad-btn);color:white;font-weight:600}
.modal-danger{flex:1;padding:10px;border:none;border-radius:12px;font-size:13px;cursor:pointer;background:linear-gradient(135deg,#F5D0DE,#F0B8CC);color:#9B3060;font-weight:600}
.f-row{display:flex;gap:6px;margin-bottom:7px}
.f-row input,.f-row select,.f-row textarea{flex:1;min-width:0;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.f-row input:focus,.f-row select:focus{border-color:var(--ac);background:var(--white)}
.f-row input.error{border-color:#D45F8C;background:#FFF5F8}
.submit-btn{width:100%;padding:10px;border:none;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--grad-btn);color:white;box-shadow:0 3px 10px rgba(160,120,210,0.28)}
.type-toggle{display:flex;background:var(--bg2);border-radius:12px;padding:2px;flex-shrink:0}
.type-btn{padding:7px 9px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--text2);border-radius:10px;font-weight:500}
.type-btn.active.income{background:var(--mint);color:var(--mint-d)}
.type-btn.active.expense{background:#FAE0EA;color:#9B3060}
.form-tabs{display:flex;gap:6px;margin-bottom:10px}
.form-tab{flex:1;padding:7px;border:1px solid var(--border);border-radius:12px;font-size:12px;cursor:pointer;background:transparent;color:var(--text2);text-align:center;font-weight:500}
.form-tab.active{background:var(--bg3);color:var(--ac-d);border-color:var(--ac);font-weight:600}
.rule-card{background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:9px 12px;margin-bottom:5px;display:flex;align-items:center;gap:9px}
.rule-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.rule-info{flex:1}
.rule-name{font-size:13px;color:var(--text);font-weight:500}
.rule-amount{font-size:12px;color:var(--mint-d);font-weight:600}
.rule-del{background:none;border:none;cursor:pointer;color:var(--text3);padding:2px;font-size:14px}
.score-row{display:flex;gap:6px;align-items:center}
.score-preview{font-size:12px;color:var(--mint-d);font-weight:700;min-width:64px;text-align:right}
.pin-setup-wrap{padding:11px 13px;background:var(--white);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pin-setup-btn{font-size:12px;padding:6px 11px;border:1px solid var(--border);border-radius:11px;cursor:pointer;background:var(--bg);color:var(--text);white-space:nowrap}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:6px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent}
.pin-dot.filled{background:var(--ac-d);border-color:var(--ac-d)}
.pin-dot.error{background:#D45F8C;border-color:#D45F8C}
.pin-error{font-size:12px;color:#D45F8C;min-height:18px;margin-bottom:8px;text-align:center}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px}
.pin-key{padding:13px;border:1px solid var(--border);border-radius:13px;font-size:20px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--text)}
.pin-key:active{background:var(--bg3)}
.pin-del{padding:13px;border:1px solid var(--border);border-radius:13px;font-size:16px;cursor:pointer;background:var(--bg);color:var(--text2)}
.pin-cancel{width:100%;padding:10px;border:1px solid var(--border);border-radius:12px;font-size:13px;cursor:pointer;background:transparent;color:var(--text2)}
.comment-input{width:100%;font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);resize:none;font-family:inherit}
.comment-input:focus{outline:none;border-color:var(--ac)}
.empty{text-align:center;padding:24px;color:var(--text3);font-size:13px}
.chart-wrap{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:9px;height:9px;border-radius:50%}
.apply-form-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.apply-form-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}
.err-msg{font-size:11px;color:#D45F8C;margin:-4px 0 6px 2px}
.mascot-wrap{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.mascot-img{width:72px;height:72px;object-fit:contain;flex-shrink:0;border-radius:8px}
.mascot-bubble{flex:1;font-size:12px;color:var(--text2);line-height:1.6}
.sync-indicator{font-size:10px;color:var(--text3);text-align:right;padding:2px 16px;height:16px}
</style>

// ── Firebase ──
function setSyncStatus(msg){const el=document.getElementById('syncStatus');if(el)el.textContent=msg;}
async function save(){
  if(!S)return;
  setSyncStatus('保存中…');
  try{await DATA_REF.set(S);setSyncStatus('');}
  catch(e){setSyncStatus('⚠️ 保存失敗');console.error(e);}
}

// ── デフォルトデータ（ルールは子供別） ──
function defaultRules(idSuffix){
  return[
    {id:'r1'+idSuffix,type:'test',name:'テスト100点',amount:500,unit:'回'},
    {id:'r2'+idSuffix,type:'test',name:'テスト（点数×係数）',amount:10,unit:'点',isScore:true},
    {id:'r3'+idSuffix,type:'chore',name:'お手伝い',amount:50,unit:'回'},
    {id:'r4'+idSuffix,type:'chore',name:'掃除',amount:100,unit:'回'}
  ];
}
function initDefault(){
  return{
    pin:null,
    children:[{id:'c1',name:'あいり',goal:{name:'',target:0}},{id:'c2',name:'ひかり',goal:{name:'',target:0}}],
    transactions:{c1:[],c2:[]},
    pending:[],
    rules:{c1:defaultRules('_c1'),c2:defaultRules('_c2')}
  };
}

// ── Firebase同期開始 ──
function startSync(){
  setSyncStatus('接続中…');
  DATA_REF.on("value",(snapshot)=>{
    const remote=snapshot.val();
    if(!remote){
      S=initDefault();
      save();
    } else {
      S=remote;
      // children マイグレーション
      if(!S.children)S.children=[{id:'c1',name:'あいり',goal:{name:'',target:0}},{id:'c2',name:'ひかり',goal:{name:'',target:0}}];
      S.children.forEach(c=>{if(!c.goal)c.goal={name:'',target:0};});
      // transactions マイグレーション
      if(!S.transactions)S.transactions={};
      S.children.forEach(c=>{
        if(!S.transactions[c.id])S.transactions[c.id]=[];
        else if(!Array.isArray(S.transactions[c.id]))S.transactions[c.id]=Object.values(S.transactions[c.id]);
      });
      // pending マイグレーション
      if(!S.pending)S.pending=[];
      else if(!Array.isArray(S.pending))S.pending=Object.values(S.pending);
      // rules マイグレーション：配列（旧・共通）→ 子供別オブジェクトに変換
      if(!S.rules){
        S.rules={};
        S.children.forEach(c=>{S.rules[c.id]=defaultRules('_'+c.id);});
      } else if(Array.isArray(S.rules)){
        // 旧形式（共通配列）→ 子供別にコピー
        const old=[...S.rules];
        S.rules={};
        S.children.forEach(c=>{S.rules[c.id]=old.map(r=>({...r,id:r.id+'_'+c.id}));});
        save(); // マイグレーション保存
      } else {
        // オブジェクト形式 → 各子供の配列を確保
        S.children.forEach(c=>{
          if(!S.rules[c.id])S.rules[c.id]=defaultRules('_'+c.id);
          else if(!Array.isArray(S.rules[c.id]))S.rules[c.id]=Object.values(S.rules[c.id]);
        });
      }
    }
    if(!activeChild||!S.children.find(c=>c.id===activeChild))activeChild=S.children[0]?.id||null;
    applyTheme(activeChild);
    setSyncStatus('');
    render();
  },(error)=>{setSyncStatus('⚠️ 接続エラー');console.error(error);});
}

function applyTheme(cid){document.body.classList.toggle('theme-pink',PINK_IDS.includes(cid));}

function getBalance(cid){const arr=S?.transactions?.[cid];const a=arr?(Array.isArray(arr)?arr:Object.values(arr)):[];return a.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);}
// 子供別ルール取得
function getRules(cid){
  const cid2=cid||activeChild;
  if(!S?.rules)return[];
  const r=S.rules[cid2];
  if(!r)return[];
  return Array.isArray(r)?r:Object.values(r);
}
function getTxArr(cid){const raw=S?.transactions?.[cid||activeChild];if(!raw)return[];return Array.isArray(raw)?raw:Object.values(raw);}

function buildLineChart(cid,goal){
  const data=getChartData(cid);
  if(!data||!data.length)return`<div class="chart-wrap"><div class="empty" style="padding:20px">データがありません</div></div>`;
  const isPink=PINK_IDS.includes(cid),balColor=isPink?'#C8336E':'#9B7ED4';
  const W=300,H=120,PL=38,PR=18,PT=10,PB=28,cW=W-PL-PR,cH=H-PT-PB,n=data.length;
  const av=data.flatMap(d=>[d.inc,d.exp,d.bal,0]);if(goal>0)av.push(goal);
  const minV=Math.min(...av),maxV=Math.max(...av),range=maxV-minV||1;
  const xOf=i=>PL+i*(cW/(n-1||1)),yOf=v=>PT+cH-(((v-minV)/range)*cH);
  const pts=arr=>arr.map((d,i)=>`${xOf(i).toFixed(1)},${yOf(d).toFixed(1)}`).join(' ');
  const dots=(arr,c)=>arr.map((v,i)=>`<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="3.5" fill="${c}" stroke="white" stroke-width="1.5"/>`).join('');
  const yLbl=[minV,minV+range/2,maxV].map(v=>`<text x="${PL-4}" y="${(yOf(v)+4).toFixed(0)}" font-size="8" fill="#A899BB" text-anchor="end">${Math.abs(v)>=1000?`${(v/1000).toFixed(0)}k`:Math.round(v)}</text>`).join('');
  const gy=goal>0?yOf(goal):null;
  return`<div class="chart-wrap"><div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px"><i class="ti ti-chart-line" style="font-size:12px;vertical-align:-2px;margin-right:4px"></i>月別グラフ</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">${[0,0.5,1].map(r=>`<line x1="${PL}" y1="${(PT+cH-r*cH).toFixed(0)}" x2="${W-PR}" y2="${(PT+cH-r*cH).toFixed(0)}" stroke="#E2D9F0" stroke-width="0.8"/>`).join('')}${yLbl}${data.map((d,i)=>`<text x="${xOf(i).toFixed(1)}" y="${H-6}" font-size="8.5" fill="#A899BB" text-anchor="middle">${d.m}月</text>`).join('')}${gy!==null?`<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W-PR}" y2="${gy.toFixed(1)}" stroke="#C9B8E8" stroke-width="1.2" stroke-dasharray="4,3"/><text x="${W-PR+2}" y="${(gy+3).toFixed(0)}" font-size="8" fill="${balColor}">目標</text>`:''}<polyline points="${pts(data.map(d=>d.inc))}" fill="none" stroke="#3BAB84" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${pts(data.map(d=>d.exp))}" fill="none" stroke="#D45F8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${pts(data.map(d=>d.bal))}" fill="none" stroke="${balColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots(data.map(d=>d.inc),'#3BAB84')}${dots(data.map(d=>d.exp),'#D45F8C')}${dots(data.map(d=>d.bal),balColor)}</svg><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:${balColor}"></div>残高</div><div class="legend-item"><div class="legend-dot" style="background:#3BAB84"></div>収入</div><div class="legend-item"><div class="legend-dot" style="background:#D45F8C"></div>支出</div>${goal>0?`<div class="legend-item"><div class="legend-dot" style="background:#C9B8E8;border:1px dashed ${balColor}"></div>目標</div>`:''}</div></div>`;
}
function getChartData(cid){
  const txs=getTxArr(cid).slice().sort((a,b)=>a.date>b.date?1:-1);
  const ms=new Set();txs.forEach(t=>{if(t.date)ms.add(t.date.slice(0,7));});ms.add(fmt(new Date()).slice(0,7));
  const months=[...ms].sort().slice(-6);const md={};months.forEach(m=>{md[m]={inc:0,exp:0};});
  txs.forEach(t=>{const m=t.date?.slice(0,7)||'';if(md[m]){if(t.type==='income')md[m].inc+=t.amount;else md[m].exp+=t.amount;}});
  const ws=months[0];let sb=0;txs.forEach(t=>{if((t.date||'').slice(0,7)<ws)sb+=t.type==='income'?t.amount:-t.amount;});
  const pts=[];let bal=sb;months.forEach(m=>{bal+=md[m].inc-md[m].exp;pts.push({m:m.slice(5),inc:md[m].inc,exp:md[m].exp,bal});});return pts;
}

// ── セリフ生成 ──
async function getWeatherInfo(){try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));const {latitude:lat,longitude:lon}=pos.coords;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,apparent_temperature&timezone=auto&forecast_days=1`);const d=await r.json();const code=d.current.weathercode,temp=Math.round(d.current.temperature_2m),feels=Math.round(d.current.apparent_temperature);const wl=c=>{if(c===0)return'晴れ';if(c<=2)return'晴れ時々曇り';if(c===3)return'曇り';if(c<=49)return'霧';if(c<=59)return'霧雨';if(c<=69)return'雨';if(c<=79)return'雪';if(c<=84)return'にわか雨';if(c<=99)return'雷雨';return'';};return{weather:wl(code),temp,feels,ok:true};}catch(e){return{ok:false};}}
function getSeason(){const m=new Date().getMonth()+1;if(m>=3&&m<=5)return'春';if(m>=6&&m<=8)return'夏';if(m>=9&&m<=11)return'秋';return'冬';}
function getTimeLabel(){const h=new Date().getHours();if(h<6)return'深夜';if(h<10)return'朝';if(h<12)return'午前';if(h<15)return'昼';if(h<18)return'午後';if(h<21)return'夜';return'夜遅く';}
function getDow(){return['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'][new Date().getDay()];}
function fallbackSerif(name,season,w){const opts=[`${name}ちゃん、こんにちは！今日も一緒に管理しようワン🐾`,`${season}だね〜！おこづかい帳、ちゃんとつけてるワン？🐕`,w.ok?`今日は${w.weather}で${w.temp}℃だよ！元気に過ごしてワン🐾`:`今日もおこづかい帳、一緒につけようワン🐾`,`お金を大切にすると、夢に近づくよ🐾`,`きょうも1日がんばってね！応援してるワン🐕`];return opts[Math.floor(Math.random()*opts.length)];}
async function updateMascotSerif(childName,balance,pendingCount){
  const el=document.getElementById('mascot-bubble');
  if(!el)return;
  if(_serifCache&&_serifCache.childId===activeChild&&Date.now()<_serifCache.expires){
    el.innerHTML='<strong style="color:var(--ac-d)">'+childName+'</strong>ちゃん、'+_serifCache.text.replace(/\n/g,'<br>');
    return;
  }
  const w=await getWeatherInfo();
  const season=getSeason(),time=getTimeLabel(),dow=getDow();
  const ctx='今日は'+dow+'の'+time+'。季節は'+season+'。'+(w.ok?'天気は'+w.weather+'、気温'+w.temp+'℃（体感'+w.feels+'℃）。':'')+childName+'ちゃんの残高は¥'+balance.toLocaleString()+'。'+(pendingCount>0?pendingCount+'件の申請が承認待ち。':'承認待ちなし。');
  const prompt='あなたはロングコートブラックタンのチワワのマスコットです。小学生の'+childName+'ちゃんのおこづかい帳アプリで毎日ひと言セリフを言います。\n\n状況: '+ctx+'\n\nルール:\n- 子供に話しかける自然な口調（2〜3文、50文字以内）\n- 天気・季節・時間帯・残高・申請状況のどれか絡める\n- 文末にワン！や🐾や🐕などを1つ\n- セリフのみ出力（説明・記号・引用符不要）';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:100,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const text=data.content&&data.content[0]?data.content[0].text.trim():fallbackSerif(childName,season,w);
    _serifCache={text,expires:Date.now()+5*60*1000,childId:activeChild};
    const el2=document.getElementById('mascot-bubble');
    if(el2)el2.innerHTML='<strong style="color:var(--ac-d)">'+childName+'</strong>ちゃん、'+text.replace(/\n/g,'<br>');
  }catch(e){
    const text=fallbackSerif(childName,season,w);
    const el2=document.getElementById('mascot-bubble');
    if(el2)el2.innerHTML='<strong style="color:var(--ac-d)">'+childName+'</strong>ちゃん、'+text.replace(/\n/g,'<br>');
  }
}

async function addRule(){

  S.rules[activeChild]=arr;
  await save();
}
async function submitManualApply(){
  const name=(document.getElementById('mName')?.value||'').trim();
  const amount=parseInt(document.getElementById('mAmount')?.value||'0');
  const rawDate=document.getElementById('mDate')?.value||'';
  const note=(document.getElementById('mNote')?.value||'').trim();
  const de=document.getElementById('mDateErr');
  if(!rawDate){if(de)de.style.display='block';document.getElementById('mDate')?.classList.add('error');showMsg('日付を選択してください');return;}
  if(de)de.style.display='none';
  if(!name||!amount||amount<1){showMsg('内容と金額を入力してください');return;}
  if(!S.pending)S.pending=[];
  S.pending.push({id:'p'+Date.now(),childId:activeChild,name,detail:`${addType==='income'?'収入':'支出'}: ${name}${note?' / '+note:''} → ${addType==='income'?'+':'-'}¥${amount.toLocaleString()}`,amount,txType:addType,date:rawDate.replace(/-/g,'/'),requestedAt:fmt(new Date()),isManual:true,parentComment:''});
  await save();showMsg('申請しました！親の承認を待ってください');
}
async function submitRuleApply(rid){
  const r=getRules(activeChild).find(x=>x.id===rid);if(!r)return;
  const rawDate=document.getElementById('ruleDate')?.value||'';
  const de=document.getElementById('ruleDateErr');
  if(!rawDate){if(de)de.style.display='block';showMsg('日付を選択してください');return;}
  if(de)de.style.display='none';
  let amount=r.amount,detail='';
  if(r.isScore){const score=parseInt(document.getElementById('scoreInput')?.value||'0');if(!score||score<1||score>100){showMsg('点数を入力してください（1〜100）');return;}amount=score*r.amount;detail=`${r.name}: ${score}点 → +¥${amount.toLocaleString()}`;}
  else detail=`${r.name}: +¥${amount.toLocaleString()}`;
  if(!S.pending)S.pending=[];
  S.pending.push({id:'p'+Date.now(),childId:activeChild,ruleId:rid,name:r.name,detail,amount,txType:'income',date:rawDate.replace(/-/g,'/'),requestedAt:fmt(new Date()),isManual:false,parentComment:''});
  await save();applyRuleId=null;showMsg('申請しました！親の承認を待ってください');
}
async function saveGoal(){
  const name=(document.getElementById('goalName')?.value||'').trim();
  const target=parseInt(document.getElementById('goalTarget')?.value||'0');
  if(!target||target<1){showMsg('目標金額を入力してください');return;}
  const child=(S?.children||[]).find(c=>c.id===activeChild);if(child)child.goal={name,target};
  await save();showMsg('目標を保存しました！');
}
let msgTimer=null;
function showMsg(txt){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--ac-d);color:white;padding:9px 18px;border-radius:20px;font-size:13px;z-index:400;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(140,100,200,0.3);transition:opacity 0.3s';document.body.appendChild(el);}el.textContent=txt;el.style.opacity='1';clearTimeout(msgTimer);msgTimer=setTimeout(()=>{el.style.opacity='0';},2400);}

// onclick属性から呼べるようwindowに登録
// グローバルスコープなのでwindow登録不要

startSync();
</script>
